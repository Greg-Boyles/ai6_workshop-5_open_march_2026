AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI6 Unit 5.W MVP workshop stack (Scale or Fail). Creates a 3-step pipeline:
  Preprocess -> Embed (MiniLM-style simulated) -> Postprocess, orchestrated by AWS Step Functions,
  with CloudWatch dashboard for observability.

Parameters:
  WorkshopName:
    Type: String
    Default: AI6-Unit5W-ScaleOrFail
  SimulatedInferMs:
    Type: Number
    Default: 250
    MinValue: 0
    Description: "Adds deterministic latency to the Embed step to simulate model inference cost."

Resources:
  # ------------------------------------------------------------
  # IAM
  # ------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${WorkshopName}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${WorkshopName}-SFNRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeWorkshopLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt PreprocessFunction.Arn
                  - !GetAtt EmbedFunction.Arn
                  - !GetAtt PostprocessFunction.Arn

  # ------------------------------------------------------------
  # Lambda functions
  # ------------------------------------------------------------
  PreprocessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${WorkshopName}-preprocess"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 3
      Code:
        ZipFile: |
          import json, time, re
          MAX_CHARS = 5000
          def handler(event, context):
              start = time.time()
              if not isinstance(event, dict):
                  raise ValueError("Input must be a JSON object")
              ticket_id = event.get("ticket_id", "T-UNKNOWN")
              text = event.get("text", "")
              if not isinstance(text, str):
                  raise ValueError("text must be a string")
              if len(text) > MAX_CHARS:
                  raise ValueError(f"PayloadTooLarge: text length {len(text)} > {MAX_CHARS}")
              clean = re.sub(r"\s+", " ", text.strip())
              tokens = clean.split()
              out = {
                  "ticket_id": ticket_id,
                  "text": clean,
                  "token_count": len(tokens),
                  "received_ts": int(time.time())
              }
              dur = int((time.time()-start)*1000)
              print(json.dumps({"step":"preprocess","ticket_id":ticket_id,"duration_ms":dur,"token_count":out["token_count"]}))
              return out

  EmbedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${WorkshopName}-embed"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 6
      Environment:
        Variables:
          EMBED_DIM: "384"
          MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2 (simulated)"
          SIMULATED_INFER_MS: !Ref SimulatedInferMs
      Code:
        ZipFile: |
          import json, time, math, hashlib, os
          DIM = int(os.environ.get("EMBED_DIM","384"))
          SIM_MS = int(os.environ.get("SIMULATED_INFER_MS","250"))
          MODEL_NAME = os.environ.get("MODEL_NAME","sentence-transformers/all-MiniLM-L6-v2 (simulated)")
          PROTOTYPES = {
              "billing": "charged twice refund invoice payment",
              "delivery": "delivery late missing parcel tracking",
              "technical": "cannot login error bug crash password reset",
              "cancellation": "cancel subscription stop service end membership"
          }
          def _embed(text: str):
              vec = [0.0]*DIM
              for token in text.lower().split():
                  h = hashlib.md5(token.encode("utf-8")).digest()
                  idx = int.from_bytes(h[:2], "big") % DIM
                  sign = 1.0 if (h[2] % 2 == 0) else -1.0
                  vec[idx] += sign
              norm = math.sqrt(sum(v*v for v in vec)) or 1.0
              return [v/norm for v in vec]
          PROTO_EMB = {k: _embed(v) for k,v in PROTOTYPES.items()}
          def _cos(a,b):
              return sum(x*y for x,y in zip(a,b))
          def handler(event, context):
              start = time.time()
              if not isinstance(event, dict):
                  raise ValueError("Input must be a JSON object")
              ticket_id = event.get("ticket_id","T-UNKNOWN")
              text = event.get("text","")
              time.sleep(SIM_MS/1000.0)
              vec = _embed(text)
              scores = {k: _cos(vec,e) for k,e in PROTO_EMB.items()}
              best = max(scores, key=scores.get)
              best_score = float(scores[best])
          
              # Compact signature: top 12 non-zero-ish dimensions (index:value), hashed.
              top_idx = sorted(range(DIM), key=lambda i: abs(vec[i]), reverse=True)[:12]
              sig = ";".join(f"{i}:{vec[i]:.3f}" for i in top_idx)
              emb_hash = hashlib.md5(sig.encode("utf-8")).hexdigest()[:10]
          
              out = dict(event)
              out.update({
                  "model": MODEL_NAME,
                  "embedding_dim": DIM,
                  "embedding_hash": emb_hash,
                  "route": best,
                  "route_score": round(best_score, 3)
              })
              dur = int((time.time()-start)*1000)
              print(json.dumps({"step":"embed","ticket_id":ticket_id,"duration_ms":dur,"route":best,"route_score":out["route_score"],"emb_hash":emb_hash}))
              return out
  PostprocessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${WorkshopName}-postprocess"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 3
      Code:
        ZipFile: |
          import json, time
          def handler(event, context):
              start = time.time()
              if not isinstance(event, dict):
                  raise ValueError("Input must be a JSON object")
              ticket_id = event.get("ticket_id","T-UNKNOWN")
              route = event.get("route","unknown")
              score = float(event.get("route_score",0.0))
              # Simple policy: some routes are more urgent; high similarity increases confidence.
              urgent_routes = {"billing","delivery"}
              priority = "P1" if (route in urgent_routes and score >= 0.15) else "P2"
              action = "HUMAN_REVIEW" if priority == "P1" else "AUTO_REPLY"
              out = dict(event)
              out.update({
                  "priority": priority,
                  "action": action,
                  "result_ts": int(time.time())
              })
              dur = int((time.time()-start)*1000)
              print(json.dumps({"step":"postprocess","ticket_id":ticket_id,"duration_ms":dur,"priority":priority,"action":action}))
              return out

  # ------------------------------------------------------------
  # Step Functions
  # ------------------------------------------------------------
  TicketTriageStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${WorkshopName}-state-machine"
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "AI6 Unit 5.W: Scale or Fail - batch Map over tickets (Preprocess -> Embed -> Postprocess)",
            "StartAt": "EnsureDefaults",
            "States": {
              "EnsureDefaults": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.max_concurrency",
                    "IsPresent": true,
                    "Next": "ProcessTickets"
                  }
                ],
                "Default": "SetDefaults"
              },
              "SetDefaults": {
                "Type": "Pass",
                "Parameters": {
                  "tickets.$": "$.tickets",
                  "max_concurrency": 2
                },
                "Next": "ProcessTickets"
              },
              "ProcessTickets": {
                "Type": "Map",
                "ItemsPath": "$.tickets",
                "MaxConcurrencyPath": "$.max_concurrency",
                "ItemProcessor": {
                  "ProcessorConfig": {
                    "Mode": "INLINE"
                  },
                  "StartAt": "Preprocess",
                  "States": {
                    "Preprocess": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${PreprocessFunction.Arn}",
                        "Payload.$": "$"
                      },
                      "OutputPath": "$.Payload",
                      "Next": "Embed"
                    },
                    "Embed": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${EmbedFunction.Arn}",
                        "Payload.$": "$"
                      },
                      "OutputPath": "$.Payload",
                      "Next": "Postprocess"
                    },
                    "Postprocess": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${PostprocessFunction.Arn}",
                        "Payload.$": "$"
                      },
                      "OutputPath": "$.Payload",
                      "End": true
                    }
                  }
                },
                "ResultPath": "$.results",
                "End": true
              }
            }
          }
  # ------------------------------------------------------------
  # CloudWatch dashboard (basic + minimal)
  # ------------------------------------------------------------
  WorkshopDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${WorkshopName}-dashboard"
      DashboardBody:
        Fn::Sub: |
          {
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "# AI6 Unit 5.W — Scale or Fail\\n**Scaling is the job. Orchestration is the mechanism. RCA is the safety net.**\\n\\nWatch Embed concurrent executions + duration during the burst."
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 2,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Invocations (by step)",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${PreprocessFunction}" ],
                    [ ".", "Invocations", "FunctionName", "${EmbedFunction}" ],
                    [ ".", "Invocations", "FunctionName", "${PostprocessFunction}" ]
                  ],
                  "stat": "Sum",
                  "period": 60
                }
              },
               {
                "type": "metric",
                "x": 12,
                "y": 2,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Embed step: Duration p95 + ConcurrentExecutions (max)",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Duration", "FunctionName", "${EmbedFunction}", { "stat": "p95" } ],
                    [ ".", "ConcurrentExecutions", "FunctionName", "${EmbedFunction}", { "stat": "Maximum", "yAxis": "right" } ]
                  ],
                  "period": 60
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 8,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "State Machine executions",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/States", "ExecutionsStarted", "StateMachineArn", "${TicketTriageStateMachine}", { "stat": "Sum" } ],
                    [ ".", "ExecutionsSucceeded", ".", ".", { "stat": "Sum" } ],
                    [ ".", "ExecutionsFailed", ".", ".", { "stat": "Sum" } ]
                  ],
                  "period": 60
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 8,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Errors (by step)",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [ "AWS/Lambda", "Errors", "FunctionName", "${PreprocessFunction}", { "stat": "Sum" } ],
                    [ ".", "Errors", "FunctionName", "${EmbedFunction}", { "stat": "Sum" } ],
                    [ ".", "Errors", "FunctionName", "${PostprocessFunction}", { "stat": "Sum" } ]
                  ],
                  "period": 60
                }
              }
            ]
          }

Outputs:
  StateMachineArn:
    Description: "Step Functions State Machine ARN"
    Value: !Ref TicketTriageStateMachine
  DashboardName:
    Description: "CloudWatch Dashboard name"
    Value: !Ref WorkshopDashboard
  PreprocessFunctionName:
    Value: !Ref PreprocessFunction
  EmbedFunctionName:
    Value: !Ref EmbedFunction
  PostprocessFunctionName:
    Value: !Ref PostprocessFunction
